name: Build Shared Libraries (composeApp Pre-compile)

# Triggered on every push to main that touches composeApp or the build config,
# so the Gradle build cache is warm before the Android/iOS build workflows run.

on:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-libs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-shared:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      # Needed to authenticate against GitHub Packages to resolve pre-built SDK AARs.
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN || github.token }}
          persist-credentials: false
          # No submodules — SDK dependencies are resolved from GitHub Packages.

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      # cache-read-only: false → this job WRITES to the local Gradle cache so
      # subsequent build-android / build-ios jobs can read without recompiling.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Compile composeApp Android (R8 full mode via gradle.properties).
      # SDK AARs (1.0.+) are resolved from GitHub Packages automatically.
      - name: Pre-compile composeApp (Android)
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 :composeApp:assemble
