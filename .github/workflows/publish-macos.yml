name: Publish macOS

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful macos build run ID (empty for the latest successful build)'
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish-build.yml
    with:
      platform: macos
      source_run_id: ${{ inputs.source_run_id }}
    secrets: inherit
