name: Build iOS (Kotlin Multiplatform)

on:
  push:

permissions:
  contents: write

jobs:
  build-ios:
    if: ${{ contains(join(github.event.commits.*.message, ' '), '[ios]') && !contains(join(github.event.commits.*.message, ' '), '[skip ci]') }}
    runs-on: macos-latest
    env:
      UNIAPP_API_SHARED_SECRET: ${{ secrets.UNIAPP_API_SHARED_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Uniapp API shared secret
        run: |
          if [ -z "${UNIAPP_API_SHARED_SECRET}" ]; then
            echo "Missing required secret: UNIAPP_API_SHARED_SECRET"
            exit 1
          fi

      - name: Build shared Kotlin framework
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned iOS archive
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/iosApp.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            UNIAPP_API_SHARED_SECRET="${UNIAPP_API_SHARED_SECRET}" \
            clean archive

      - name: Package unsigned IPA
        run: |
          rm -rf build/export build/Payload
          mkdir -p build/export/Payload

          APP_PATH=$(find build/iosApp.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "App bundle not found in archive"
            exit 1
          fi

          cp -R "$APP_PATH" build/export/Payload/
          (
            cd build/export
            zip -qry ../iosApp-unsigned.ipa Payload
          )

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA_PATH="build/iosApp-unsigned.ipa"

          if [ ! -f "$IPA_PATH" ]; then
            echo "Unsigned IPA not found"
            exit 1
          fi

          TAG="ios-build-${GITHUB_RUN_NUMBER}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA_PATH" --clobber
          else
            gh release create "$TAG" "$IPA_PATH" \
              --title "iOS Build $GITHUB_RUN_NUMBER" \
              --notes "Automatic build from ${GITHUB_SHA}"
          fi
