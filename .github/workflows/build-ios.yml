name: Build iOS (Kotlin Multiplatform)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      UNIAPP_APP_STORE_URL: ${{ vars.UNIAPP_APP_STORE_URL }}
      GITHUB_ACTOR: ${{ github.actor }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN || github.token }}
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Cache is keyed on source hashes so the compiled Kotlin/Native framework
          # is reused across runs when nothing relevant changes.
          cache-read-only: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve verified SDK binaries
        env:
          GITHUB_TOKEN: ${{ secrets.SDK_READ_TOKEN || secrets.DEPLOY_TOKEN || github.token }}
        run: python3 scripts/fetch_sdk_binaries.py

      - name: Build shared Kotlin framework
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned iOS archive
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/iosApp.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            clean archive

      - name: Package unsigned IPA
        run: |
          rm -rf build/export build/Payload
          mkdir -p build/export/Payload

          APP_PATH=$(find build/iosApp.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "App bundle not found in archive"
            exit 1
          fi

          cp -R "$APP_PATH" build/export/Payload/
          (
            cd build/export
            zip -qry ../iosApp-unsigned.ipa Payload
          )

      - name: Store unsigned archive for development
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-${{ github.run_id }}
          path: build/iosApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
