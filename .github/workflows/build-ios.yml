name: Build iOS (Kotlin Multiplatform)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      UNIAPP_APP_STORE_URL: ${{ vars.UNIAPP_APP_STORE_URL }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.DEPLOY_TOKEN || github.token }}
          persist-credentials: false

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Resolve verified SDK binaries
        env:
          GITHUB_TOKEN: ${{ secrets.SDK_READ_TOKEN || secrets.DEPLOY_TOKEN || github.token }}
        run: |
          python3 scripts/fetch_sdk_binaries.py
          mkdir -p build
          cp .sdk-binaries/resolved.properties build/sdk-binaries.properties

      - name: Validate build tooling
        run: python3 scripts/validate_release.py

      - name: Build simulator app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iOS archive
        run: |
          BASE_BUILD=$(grep '^uniapp.versionCodeBase=' gradle.properties | cut -d= -f2)
          BUILD_NUMBER=$((BASE_BUILD + GITHUB_RUN_NUMBER))
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/iosApp.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            archive

      - name: Package unsigned IPA
        run: |
          rm -rf build/export build/Payload
          mkdir -p build/export/Payload

          APP_PATH=$(find build/iosApp.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "App bundle not found in archive"
            exit 1
          fi

          cp -R "$APP_PATH" build/export/Payload/
          (
            cd build/export
            zip -qry ../iosApp-unsigned.ipa Payload
          )

      - name: Store unsigned archive for development
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-unsigned-${{ github.run_id }}
          path: |
            build/iosApp-unsigned.ipa
            build/sdk-binaries.properties
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-diagnostics-${{ github.run_id }}
          path: |
            build/reports/problems/
            composeApp/build/reports/
            build/sdk-binaries.properties
          if-no-files-found: ignore
          retention-days: 14
