name: Build Android (APK)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.DEPLOY_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve verified SDK binaries
        env:
          GITHUB_TOKEN: ${{ secrets.SDK_READ_TOKEN || secrets.DEPLOY_TOKEN || github.token }}
        run: python3 scripts/fetch_sdk_binaries.py
      - name: Use disk-backed build temporary files
        run: |
          set -euo pipefail
          build_temp_dir="$RUNNER_TEMP/uniapp-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p -- "$build_temp_dir"
          printf 'TMPDIR=%s\n' "$build_temp_dir" >> "$GITHUB_ENV"
          printf 'JAVA_TOOL_OPTIONS=%s-Djava.io.tmpdir=%s\n' "${JAVA_TOOL_OPTIONS:+$JAVA_TOOL_OPTIONS }" "$build_temp_dir" >> "$GITHUB_ENV"
          df -h "$build_temp_dir"
          df -i "$build_temp_dir"
          dd if=/dev/zero of="$build_temp_dir/.write-check" bs=1M count=64 status=none
          rm -- "$build_temp_dir/.write-check"
      - name: Validate release tooling and app
        run: |
          set -euo pipefail
          python3 scripts/validate_release.py
          ./gradlew --no-daemon --max-workers=2 :composeApp:testAndroidHostTest
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-test-results-${{ github.run_id }}
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Build unsigned release and debug APKs
        run: |
          set -euo pipefail
          unset RELEASE_STORE_FILE RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD
          ./gradlew --no-daemon --no-configuration-cache --max-workers=2 :androidApp:assembleRelease :androidApp:assembleDebug
          python3 scripts/prepare_build_artifact.py android --output publish-input-unsigned --signing unsigned
      - name: Store unsigned release and debug APKs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-build-${{ github.run_id }}-unsigned
          path: publish-input-unsigned/
          if-no-files-found: error
          retention-days: 30
      - name: Build officially signed release when the key is available
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/uniapp-release-${{ github.run_id }}.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RELEASE_STORE_FILE"' EXIT
          if [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$RELEASE_STORE_PASSWORD" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" ]]; then
            umask 077
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          else
            echo 'Release signing key unavailable; unsigned and debug packages are already stored.'
            exit 0
          fi
          ./gradlew --no-daemon --no-configuration-cache --max-workers=2 :androidApp:assembleRelease
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          for apk in androidApp/build/outputs/apk/release/*.apk; do "$APK_SIGNER" verify --verbose "$apk"; done
          python3 scripts/prepare_build_artifact.py android --output publish-input-signed --signing release-key
      - name: Store officially signed release and debug APKs
        if: hashFiles('publish-input-signed/context.json') != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-build-${{ github.run_id }}-signed
          path: publish-input-signed/
          if-no-files-found: error
          retention-days: 30
      - name: Remove compiler temporary files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/uniapp-build-${{ github.run_id }}-${{ github.run_attempt }}"
