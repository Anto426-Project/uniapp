name: Build Android (Signed APK)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: self-hosted

    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_FILE: key/release.keystore
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate signing secrets
        run: |
          for v in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "❌ Missing $v"
              exit 1
            fi
          done

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore keystore
        run: |
          mkdir -p "$(dirname "${RELEASE_STORE_FILE}")"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"

      - name: Build release APK (signed)
        run: |
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            :androidApp:assembleRelease \
            -PENABLE_ABI_SPLITS=true \
            -PRELEASE_STORE_FILE="$RELEASE_STORE_FILE" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: List generated APKs
        run: |
          echo "📦 APK generati:"
          find androidApp/build/outputs/apk/release -type f -name "*.apk"

      - name: Collect signed APKs
        run: |
          mkdir -p publish-input/release

          APK_FILES=$(find androidApp/build/outputs/apk/release -type f -name "*release.apk")

          if [ -z "$APK_FILES" ]; then
            echo "❌ Nessun APK release trovato"
            exit 1
          fi

          for apk in $APK_FILES; do
            echo "✔ Copiando $apk"
            cp "$apk" publish-input/release/
          done

          # Copia eventuale metadata di output prodotto da AGP
          if [ -f "androidApp/build/outputs/apk/release/output-metadata.json" ]; then
            echo "✔ Copiando output-metadata.json"
            cp androidApp/build/outputs/apk/release/output-metadata.json publish-input/release/
          fi

      - name: Verify APK signature
        run: |
          for apk in publish-input/release/*.apk; do
            echo "🔐 Verifica firma: $apk"
            jarsigner -verify -verbose -certs "$apk"
          done

      # 📦 CONTEXT
      - name: Detect release channel
        id: release_context
        run: |
          python3 - <<'PYCODE'
          import json, os
          with open("androidApp/build/outputs/apk/release/output-metadata.json") as handle:
              version = json.load(handle)["elements"][0]["versionName"]
          channel = "beta" if "beta" in version.lower() else "stable"
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"release_channel={channel}\n")
          PYCODE

      - name: Save build context
        run: |
          mkdir -p publish-input/context
          cat > publish-input/context/build-context.env <<EOF
          RELEASE_CHANNEL=${{ steps.release_context.outputs.release_channel }}
          RELEASE_ARTIFACT_DIR=${{ steps.release_context.outputs.release_channel }}
          SOURCE_REPOSITORY=${GITHUB_REPOSITORY}
          SOURCE_SHA=${GITHUB_SHA}
          SOURCE_REF_NAME=${GITHUB_REF_NAME}
          EOF

      - name: Store artifact on runner filesystem
        shell: bash
        run: |
          set -euo pipefail

          RUNNER_ARTIFACTS_ROOT="${RUNNER_TEMP}/../uniapp-artifacts"
          RUNNER_ARTIFACT_DIR="${RUNNER_ARTIFACTS_ROOT}/android-build-signed/${GITHUB_RUN_ID}"
          mkdir -p "${RUNNER_ARTIFACT_DIR}"
          cp -a publish-input/. "${RUNNER_ARTIFACT_DIR}/"

          echo "Runner artifact saved in: ${RUNNER_ARTIFACT_DIR}"
          find "${RUNNER_ARTIFACT_DIR}" -maxdepth 3 -type f | sort

      - name: Cleanup old runner artifacts
        shell: bash
        run: |
          set -euo pipefail

          RUNNER_ARTIFACTS_ROOT="${RUNNER_TEMP}/../uniapp-artifacts"
          ROOT="${RUNNER_ARTIFACTS_ROOT}/android-build-signed"
          mkdir -p "${ROOT}"

          find "${ROOT}" -mindepth 1 -maxdepth 1 -type d -mtime +14 -print -exec rm -rf {} +
