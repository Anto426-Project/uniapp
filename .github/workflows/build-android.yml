name: Build Android (Signed APK)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve verified SDK binaries
        env:
          GITHUB_TOKEN: ${{ secrets.SDK_READ_TOKEN || secrets.DEPLOY_TOKEN || github.token }}
        run: python3 scripts/fetch_sdk_binaries.py
      - name: Validate release tooling and app
        run: |
          set -euo pipefail
          python3 scripts/validate_release.py
          ./gradlew --no-daemon --max-workers=2 :composeApp:testAndroidHostTest
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results-${{ github.run_id }}
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Build and verify signed APKs
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/uniapp-release-${{ github.run_id }}.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RELEASE_STORE_FILE"' EXIT
          for key in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            test -n "${!key}" || { echo "Missing signing secret: $key"; exit 1; }
          done
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          ./gradlew --no-daemon --no-configuration-cache --max-workers=2 :androidApp:assembleRelease
          mkdir -p publish-input/release
          cp androidApp/build/outputs/apk/release/*.apk publish-input/release/
          cp androidApp/build/outputs/apk/release/output-metadata.json publish-input/release/
          cp .sdk-binaries/resolved.properties publish-input/sdk-binaries.properties
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APK_SIGNER"
          for apk in publish-input/release/*.apk; do
            "$APK_SIGNER" verify --verbose "$apk"
          done
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from release_metadata import read_apks, write_json
          read_apks(Path('publish-input/release/output-metadata.json'))
          write_json(Path('publish-input/context.json'), {
              'sourceSha': os.environ['GITHUB_SHA'],
              'sourceRepository': os.environ['GITHUB_REPOSITORY'],
              'runId': os.environ['GITHUB_RUN_ID'],
          })
          PY
      - name: Upload signed build
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-${{ github.run_id }}
          path: publish-input/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Remove signing material
        if: always()
        run: rm -f "${RUNNER_TEMP}/uniapp-release-${GITHUB_RUN_ID}.keystore"
