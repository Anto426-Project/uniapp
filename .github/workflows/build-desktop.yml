name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      desktop_os:
        description: 'Desktop operating system to build'
        type: choice
        default: all
        options: [all, linux, archlinux, windows, macos]

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platforms:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        uses: actions/github-script@v9.0.0
        env:
          DESKTOP_OS: ${{ inputs.desktop_os }}
        with:
          script: |
            const choices = [
              {runner: 'ubuntu-latest', platform: 'linux', package_task: 'packageDeb'},
              {runner: 'ubuntu-latest', platform: 'archlinux', package_task: 'createDistributable'},
              {runner: 'windows-latest', platform: 'windows', package_task: 'packageMsi'},
              {runner: 'macos-26', platform: 'macos', package_task: 'packageDmg'}
            ];
            const selected = process.env.DESKTOP_OS;
            if (!['all', ...choices.map(item => item.platform)].includes(selected)) throw new Error('Unsupported desktop OS');
            core.setOutput('matrix', JSON.stringify({include: choices.filter(item => selected === 'all' || item.platform === selected)}));
  build:
    needs: platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.DEPLOY_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Resolve mobile binaries and compile pinned desktop SDK sources locally
        env:
          GITHUB_TOKEN: ${{ secrets.SDK_READ_TOKEN || secrets.DEPLOY_TOKEN || github.token }}
        run: python3 scripts/fetch_sdk_binaries.py --desktop
      - name: Validate tooling and test the shared app on JVM
        run: |
          python3 scripts/validate_release.py
          ./gradlew --no-daemon --max-workers=2 :composeApp:desktopTest
      - name: Compile and package desktop
        run: ./gradlew --no-daemon --max-workers=2 :desktopApp:createDistributable :desktopApp:${{ matrix.package_task }}
      - name: Package Arch Linux with makepkg
        if: matrix.platform == 'archlinux'
        run: |
          python3 scripts/prepare_archlinux.py
          docker run --rm \
            --volume "$PWD/desktopApp/build/compose/binaries/main/archlinux:/package" \
            archlinux:base-devel-20260927.0.600689 bash -euc '
              useradd --uid "$(stat -c %u /package)" --create-home builder
              cd /package
              runuser -u builder -- makepkg --nodeps --noconfirm
              pacman -Qip ./*.pkg.tar.zst
              pacman -Qlp ./*.pkg.tar.zst
            '
      - name: Prepare verified build artifacts
        env:
          DESKTOP_OS: ${{ matrix.platform }}
        run: python3 scripts/prepare_build_artifact.py desktop --output publish-input --os "$DESKTOP_OS"
      - name: Store all desktop packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-build-${{ github.run_id }}-${{ matrix.platform }}
          path: publish-input/
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-tests-${{ github.run_id }}-${{ matrix.platform }}
          path: |
            composeApp/build/test-results/desktopTest/
            composeApp/build/reports/tests/desktopTest/
            desktopApp/build/compose/logs/
          if-no-files-found: ignore
          retention-days: 14
