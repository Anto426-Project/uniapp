name: Publish Android Build

on:
  workflow_run:
    workflows: [Build Android (Signed APK)]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful Android build run ID (empty for the latest on main)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: uniapp-distribution
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_REPO: Anto426-Project/uniapp-upstream
      DEPLOY_BRANCH: main
    steps:
      - name: Resolve and validate source build
        id: source
        uses: actions/github-script@v8
        env:
          REQUESTED_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
        with:
          script: |
            const repo = context.repo;
            let id = process.env.REQUESTED_RUN_ID;
            if (!id) {
              const {data} = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: 'build-android.yml', branch: 'main', status: 'success', per_page: 1
              });
              id = String(data.workflow_runs[0]?.id || '');
            }
            if (!/^\d+$/.test(id)) throw new Error('A successful build run ID is required');
            const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id: Number(id)});
            const {data: workflow} = await github.rest.actions.getWorkflow({...repo, workflow_id: 'build-android.yml'});
            if (run.workflow_id !== workflow.id || run.conclusion !== 'success' || run.head_branch !== 'main' ||
                run.head_repository?.full_name !== `${repo.owner}/${repo.repo}` ||
                run.event !== 'workflow_dispatch') {
              throw new Error('Only successful trusted main-branch Android builds can be published');
            }
            core.setOutput('run_id', id);
            core.setOutput('sha', run.head_sha);
      - name: Checkout the exact built revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Download signed build
        uses: actions/download-artifact@v4
        with:
          name: android-signed-${{ steps.source.outputs.run_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: incoming
      - name: Validate artifact context
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          context = json.loads(Path('incoming/context.json').read_text())
          expected = {'sourceSha': os.environ['SOURCE_SHA'], 'sourceRepository': os.environ['GITHUB_REPOSITORY'], 'runId': os.environ['SOURCE_RUN_ID']}
          if context != expected:
              raise SystemExit('Artifact context does not match the selected build')
          PY
      - name: Verify versionCode progression
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          incoming_meta = json.loads(Path('incoming/release/output-metadata.json').read_text())
          elements = incoming_meta.get('elements', [])
          if not elements:
              raise SystemExit('No APK elements in output-metadata.json')
          incoming_code = elements[0].get('versionCode')
          if not isinstance(incoming_code, int) or incoming_code <= 0:
              raise SystemExit(f'Invalid incoming versionCode: {incoming_code!r}')
          deployed_path = Path('deploy-repo/update.json')
          if deployed_path.exists():
              deployed = json.loads(deployed_path.read_text())
              published_code = deployed.get('latestVersionCode', 0)
              if not isinstance(published_code, int):
                  published_code = 0
              if incoming_code <= published_code:
                  raise SystemExit(
                      f'versionCode regression: incoming {incoming_code} '
                      f'<= published {published_code}. '
                      'Increment GITHUB_RUN_NUMBER by triggering a new build.'
                  )
              print(f'versionCode OK: {published_code} -> {incoming_code}')
          else:
              print(f'No existing update.json found; first publish with versionCode {incoming_code}')
          PY
      - name: Checkout distribution repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOY_REPO }}
          ref: ${{ env.DEPLOY_BRANCH }}
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: deploy-repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Prepare manifest and release notes
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/generate_update_manifest.py --metadata incoming/release/output-metadata.json \
            --manual-config update-config.json --existing deploy-repo/update.json \
            --deploy-repo "$DEPLOY_REPO" --build-commit "$SOURCE_SHA" --output incoming/update.json
          python3 scripts/generate_github_release_metadata.py --metadata incoming/release/output-metadata.json \
            --update-manifest incoming/update.json --source-repo "$GITHUB_REPOSITORY" \
            --output incoming/release-notes.md --github-env-output "$GITHUB_ENV"
          python3 scripts/generate_deploy_readme.py --update-manifest incoming/update.json \
            --source-repo "$GITHUB_REPOSITORY" --output incoming/README.md
      - name: Build distribution website
        env:
          NEXT_PUBLIC_BASE_PATH: /uniapp-upstream
        run: |
          set -euo pipefail
          cp incoming/update.json website/public/update.json
          cd website
          npm ci
          npm run build
          npm run check:export
      - name: Verify website on desktop and mobile
        working-directory: website
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload website failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: website-test-results-${{ github.run_id }}
          path: website/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish release assets then update distribution
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: bash scripts/publish_android.sh
