name: Publish Platform Build

on:
  workflow_call:
    inputs:
      platform:
        description: 'One application platform: android, ios, linux, windows or macos'
        required: true
        type: string
      source_run_id:
        description: 'Platform build run ID (empty for the most recent successful build)'
        required: false
        type: string
        default: ''
    secrets:
      DEPLOY_TOKEN:
        required: true

permissions:
  contents: read
  actions: write

concurrency:
  group: uniapp-distribution
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_REPO: Anto426-Project/uniapp-upstream
    steps:
      - name: Checkout publishing tools
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Test publication source selection
        run: node --test scripts/tests/resolve_publish_source.test.cjs
      - name: Resolve a trusted successful build
        id: source
        uses: actions/github-script@v9.0.0
        env:
          REQUESTED_RUN_ID: ${{ inputs.source_run_id }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
        with:
          script: |
            const resolve = require('./scripts/resolve_publish_source.cjs');
            await resolve({github, context, core, platform: process.env.REQUESTED_PLATFORM,
              requestedRunId: process.env.REQUESTED_RUN_ID});
      - name: Checkout exact build release policy
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: build-source
          sparse-checkout: update-config.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download every completed platform variant
        uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_ids }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: incoming
      - name: Checkout distribution repository
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.DEPLOY_REPO }}
          ref: main
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: deploy-repo
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Verify source, variants and checksums
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_PLATFORM: ${{ steps.source.outputs.platform }}
        run: |
          python3 scripts/collect_build_artifacts.py --incoming incoming --output publish-plan \
            --repository "$GITHUB_REPOSITORY" --revision "$SOURCE_SHA" --run-id "$SOURCE_RUN_ID" \
            --platform "$SOURCE_PLATFORM"
      - name: Publish one platform release
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_PLATFORM: ${{ steps.source.outputs.platform }}
        run: |
          python3 scripts/publish_builds.py --plan publish-plan/plan.json --repository "$DEPLOY_REPO" \
            --deploy-directory deploy-repo --policy build-source/update-config.json \
            --source-repo "$GITHUB_REPOSITORY" --revision "$SOURCE_SHA" --run-id "$SOURCE_RUN_ID" \
            --platform "$SOURCE_PLATFORM"

      - name: Refresh the distribution website after publication
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'build-website.yml', ref: 'main'
            });
