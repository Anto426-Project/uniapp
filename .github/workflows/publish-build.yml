name: Publish All Builds

on:
  workflow_run:
    workflows: [Build Android (APK), Build iOS (Kotlin Multiplatform), Build Desktop]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Android, iOS or desktop build run ID (empty for the most recent completed build)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: uniapp-distribution
  cancel-in-progress: false

jobs:
  publish:
    # A failed matrix may still contain successfully verified packages for other operating systems.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_REPO: Anto426-Project/uniapp-upstream
    steps:
      - name: Resolve a trusted completed build
        id: source
        uses: actions/github-script@v9.0.0
        env:
          REQUESTED_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
        with:
          script: |
            const allowed = {'build-android.yml': 'android', 'build-ios.yml': 'ios', 'build-desktop.yml': 'desktop'};
            const workflows = {};
            for (const [path, platform] of Object.entries(allowed)) {
              const {data} = await github.rest.actions.getWorkflow({...context.repo, workflow_id: path});
              workflows[data.id] = platform;
            }
            let id = process.env.REQUESTED_RUN_ID;
            if (!id) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({...context.repo, status: 'completed', per_page: 100});
              id = String(data.workflow_runs.find(run => workflows[run.workflow_id] && run.head_branch === 'main' && run.event === 'workflow_dispatch' && ['success','failure'].includes(run.conclusion))?.id || '');
            }
            if (!/^\d+$/.test(id)) throw new Error('A completed build run ID is required');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(id)});
            const platform = workflows[run.workflow_id];
            if (!platform || run.status !== 'completed' || !['success','failure'].includes(run.conclusion) ||
                run.head_branch !== 'main' || run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` || run.event !== 'workflow_dispatch') {
              throw new Error('Only trusted main-branch Android/iOS/desktop builds can be published');
            }
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: Number(id), per_page: 100});
            const prefix = `${platform}-build-${id}`;
            if (!data.artifacts.some(artifact => !artifact.expired && (artifact.name === prefix || artifact.name.startsWith(`${prefix}-`)))) {
              throw new Error('The selected run has no completed build packages');
            }
            core.setOutput('run_id', id);
            core.setOutput('sha', run.head_sha);
            core.setOutput('platform', platform);
      - name: Checkout publishing tools
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout exact build release policy
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: build-source
          sparse-checkout: update-config.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download every completed platform variant
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: ${{ steps.source.outputs.platform }}-build-${{ steps.source.outputs.run_id }}*
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: incoming
      - name: Checkout distribution repository
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.DEPLOY_REPO }}
          ref: main
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: deploy-repo
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Verify source, variants and checksums
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          python3 scripts/collect_build_artifacts.py --incoming incoming --output publish-plan \
            --repository "$GITHUB_REPOSITORY" --revision "$SOURCE_SHA" --run-id "$SOURCE_RUN_ID"
      - name: Publish signed, unsigned and desktop packages
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          python3 scripts/publish_builds.py --plan publish-plan/plan.json --repository "$DEPLOY_REPO" \
            --deploy-directory deploy-repo --policy build-source/update-config.json \
            --source-repo "$GITHUB_REPOSITORY" --revision "$SOURCE_SHA" --run-id "$SOURCE_RUN_ID"
