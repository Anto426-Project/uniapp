# --- GRADLE USER SETTINGS ---
# Distribuzione e path (Default)
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
validateDistributionUrl=true
networkTimeout=10000

# --- PERFORMANCE & DAEMON ---
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1G
kotlin.daemon.jvmargs=-Xmx4096M

# Parallelismo e Caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# --- KOTLIN MULTIPLATFORM (KMP) ---
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
org.jetbrains.compose.resources.compiler.check.visibility=false
kotlin.mpp.androidSourceSetLayoutVersion=2

# --- ANDROID SETTINGS ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# --- OTTIMIZZAZIONE APK (R8) ---
android.enableR8.fullMode=true
android.r8.strictFullModeForKeepRules=false

# Velocità di packaging
android.useNewApkCreator=true